[build]
builder = "DOCKERFILE"
# Define o diretório raiz do serviço. O Dockerfile será procurado AQUI.
rootDirectory = "backend/biometry_service"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
