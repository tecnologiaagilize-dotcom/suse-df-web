[build]
builder = "DOCKERFILE"
# Define o diretório raiz do serviço para a pasta do backend Python
rootDirectory = "backend/biometry_service"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
